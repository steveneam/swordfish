# yaml-language-server: $schema=https://creativeprojects.github.io/resticprofile/jsonschema/config.json
#
# resticprofile config - nightly restic -> B2, encrypted (CHARTER pinned
# decision 5; runbook: runbooks/backup-restore.md). Shipped to
# /etc/resticprofile/profiles.yaml by backups-apply + phase7-backups.sh.
# PER-BOX PROFILES: one profile per box, named by `hostname -s` (phase7 selects
# it that way); boxes differ only in their bucket - everything else inherits
# from syd1 so retention/schedule/hook policy can never drift between boxes.
#
# Secrets stay OUT of this file (0600 root, written by backups-apply from repo secrets):
#   /etc/resticprofile/password.txt  repo password (founder-held copy = the DR key)
#   /etc/resticprofile/b2.env        bucket-scoped B2 key (B2_ACCOUNT_ID/B2_ACCOUNT_KEY)
#   /etc/resticprofile/hc-url        healthchecks.io ping URL (dead-man's switch)
#
# All times UTC (the box clock is UTC). Nightly backup 15:00 = 01:00 AEST /
# 02:00 AEDT pre-dawn Sydney; prune Sat + check Sun 17:00; all clear of the
# 18:30 unattended-upgrades reboot window (phase2-host.sh).

version: "1"

syd1:
  repository: "b2:swordfish-syd1-backups:restic"
  password-file: /etc/resticprofile/password.txt
  env-file: /etc/resticprofile/b2.env
  # first contact creates the repo; a no-op on every run after
  initialize: true

  backup:
    # explicit allow-list, no blanket /var/lib/docker: the raw dokploy-postgres
    # volume is deliberately absent - file-level backup of a running DB is not
    # consistent; the pre-backup pg_dump (pre-backup.d/) is what restores
    source:
      - /etc/dokploy                          # control plane + Traefik dynamic + acme.json
      - /opt/swordfish                        # edge compose + backup layer as-deployed
      - /var/backups/swordfish                # pre-backup dumps land here
      - /var/lib/docker/volumes/dokploy/_data # dokploy's /root/.docker (registry creds)
    exclude-caches: true
    # stateful-workload pattern: every executable in pre-backup.d runs before the
    # snapshot (dump-before-snapshot); add a file there, not a line here
    run-before: "run-parts --exit-on-error /etc/resticprofile/pre-backup.d"
    run-after: "/etc/resticprofile/hc-ping.sh success"
    run-after-fail: "/etc/resticprofile/hc-ping.sh fail"
    schedule: "*-*-* 15:00:00"
    schedule-permission: system
    schedule-lock-wait: 15m

  # applied after every backup; prune stays with the Saturday job
  retention:
    after-backup: true
    keep-daily: 7
    keep-weekly: 4
    keep-monthly: 6
    prune: false

  check:
    read-data-subset: "10%"
    run-after-fail: "/etc/resticprofile/hc-ping.sh fail"
    schedule: "Sun *-*-* 17:00:00"
    schedule-permission: system
    schedule-lock-wait: 15m

  prune:
    run-after-fail: "/etc/resticprofile/hc-ping.sh fail"
    schedule: "Sat *-*-* 17:00:00"
    schedule-permission: system
    schedule-lock-wait: 15m

# syd2 (Bucket 5, Stage-2 shared box): same policy, its own bucket
# (per-box bucket + bucket-scoped key = blast-radius isolation, decision 6).
# STANDALONE since thalon-data joined the source list - resticprofile
# inheritance merges lists POSITIONALLY (see the syd3 comment below), so any
# structural list change = write the profile out in full. Policy values
# hand-copied from syd1 - keep in lockstep when either changes.
# thalon-web (first dogfood tenant, 2026-07-13): its volume is in the set but
# the live PGlite dir pg/** stays OUT - file-level backup of a live DB is not
# consistent; the pre-backup dump (pre-backup.d/30-thalon-pglite-dump) is what
# restores. objects/ (immutable once written) + pointer bundles (small atomic
# JSON writes) are snapshot-safe as-is, per the thalon ask-backs note.
syd2:
  repository: "b2:swordfish-syd2-backups:restic"
  password-file: /etc/resticprofile/password.txt
  env-file: /etc/resticprofile/b2.env
  initialize: true

  backup:
    source:
      - /etc/dokploy                          # control plane + Traefik dynamic + acme.json
      - /opt/swordfish                        # edge compose + backup layer as-deployed
      - /var/backups/swordfish                # pre-backup dumps land here
      - /var/lib/docker/volumes/dokploy/_data # dokploy's /root/.docker (registry creds)
      - /var/lib/docker/volumes/thalon-data/_data # thalon tenant volume (/data)
      - /srv/project1                         # Project 1 landing zone (manifests; assets excluded below)
    exclude:
      # the raw live PGlite dir - 30-thalon-pglite-dump's artifact
      # (backups/pglite-dump.tar.gz, inside the volume) is what restores
      - /var/lib/docker/volumes/thalon-data/_data/pg/**
      # RECORDED EXCEPTION (migration plan Phase 0.2, 2026-07-15): the ~41 GB
      # Project 1 reference corpus is reproducible public data whose restore
      # path IS the re-seed from its managed source bucket - only the
      # manifests/checksums (small, restic-covered above) are the record.
      # backup-restore-drill.yml asserts both directions via the canaries
      # setup-landing-zone.sh seeds (manifest restores, canary must not).
      - /srv/project1/assets/**
    exclude-caches: true
    # stateful-workload pattern: every executable in pre-backup.d runs before the
    # snapshot (dump-before-snapshot); add a file there, not a line here
    run-before: "run-parts --exit-on-error /etc/resticprofile/pre-backup.d"
    run-after: "/etc/resticprofile/hc-ping.sh success"
    run-after-fail: "/etc/resticprofile/hc-ping.sh fail"
    schedule: "*-*-* 15:00:00"
    schedule-permission: system
    schedule-lock-wait: 15m

  retention:
    after-backup: true
    keep-daily: 7
    keep-weekly: 4
    keep-monthly: 6
    prune: false

  check:
    read-data-subset: "10%"
    run-after-fail: "/etc/resticprofile/hc-ping.sh fail"
    schedule: "Sun *-*-* 17:00:00"
    schedule-permission: system
    schedule-lock-wait: 15m

  prune:
    run-after-fail: "/etc/resticprofile/hc-ping.sh fail"
    schedule: "Sat *-*-* 17:00:00"
    schedule-permission: system
    schedule-lock-wait: 15m

# syd3 (machine-migration amendment 2026-07-10): the agent cockpit - STANDALONE
# profile, deliberately NOT `inherit: syd1`. resticprofile inheritance merges
# lists POSITIONALLY (observed live, run 29091746138: a 1-element source
# override replaced only element[0] of syd1's list, leaving the docker-volume
# path in -> restic exit 3 on the docker-less cockpit). inherit is only safe
# for scalar overrides (syd2's repository swap); any structural list change =
# write the profile out in full. Policy values (retention/schedule/check/prune)
# are hand-copied from syd1 - keep them in lockstep when either changes.
# Cockpit state = the deploy home dir (agent memory/transcripts, repos'
# gitignored secrets, the vault when it lands). No run-before: syd3 has nothing
# to dump. (The old reason - "the fleet dokploy hook hard-fails without docker"
# - was retired 2026-07-17: every docker-dependent hook now SELF-SKIPS on a
# box with no docker, so run-parts is safe on cockpit boxes. syd4 relies on
# that and DOES run the chain, for thalon's native dev-postgres dump.)
syd3:
  repository: "b2:swordfish-syd3-backups:restic"
  password-file: /etc/resticprofile/password.txt
  env-file: /etc/resticprofile/b2.env
  initialize: true

  backup:
    source:
      - /home/deploy
    exclude:
      - /home/deploy/.cache
      - /home/deploy/.npm
      - /home/deploy/.claude/cache
      - /home/deploy/.claude/paste-cache
      - /home/deploy/.claude/shell-snapshots
      - "**/node_modules"
    exclude-caches: true
    run-after: "/etc/resticprofile/hc-ping.sh success"
    run-after-fail: "/etc/resticprofile/hc-ping.sh fail"
    schedule: "*-*-* 15:00:00"
    schedule-permission: system
    schedule-lock-wait: 15m

  retention:
    after-backup: true
    keep-daily: 7
    keep-weekly: 4
    keep-monthly: 6
    prune: false

  check:
    read-data-subset: "10%"
    run-after-fail: "/etc/resticprofile/hc-ping.sh fail"
    schedule: "Sun *-*-* 17:00:00"
    schedule-permission: system
    schedule-lock-wait: 15m

  prune:
    run-after-fail: "/etc/resticprofile/hc-ping.sh fail"
    schedule: "Sat *-*-* 17:00:00"
    schedule-permission: system
    schedule-lock-wait: 15m

# syd4 (machine-migration amendment 2026-07-10): the portfolio workspace box -
# STANDALONE like syd3 (same positional-inherit lesson; see the syd3 comment).
# Whole-home source: this box holds ALL project repos (gitignored secrets
# included), the research vault, and every agent's ~/.claude state. Policy
# values hand-copied from syd1/syd3 - keep in lockstep when any changes.
syd4:
  repository: "b2:swordfish-syd4-backups:restic"
  password-file: /etc/resticprofile/password.txt
  env-file: /etc/resticprofile/b2.env
  initialize: true

  backup:
    source:
      - /home/deploy
    exclude:
      - /home/deploy/.cache
      - /home/deploy/.npm
      - /home/deploy/.claude/cache
      - /home/deploy/.claude/paste-cache
      - /home/deploy/.claude/shell-snapshots
      - "**/node_modules"
      # RECORDED EXCEPTION (founder call 2026-07-17, B2 free-cap incident):
      # machine-migration STAGING copies (laptop->box migration completed
      # 2026-07-13; everything here was restored into the live home dir, which
      # IS in this backup). A backup of a copy of backed-up things - 8.9 GB of
      # the 10.19 GB that blew the 10 GB free cap and hard-blocked uploads
      # account-wide (B2 rejects b2_get_upload_url at cap; restic then hangs
      # retrying its own lock upload). Restore path if needed: the live home.
      - /home/deploy/migration
      # RECORDED EXCEPTION (same call): local copy of the 10 preserved
      # render-only objects (4.8 GB) - the BULK SUBDIR ONLY, deliberately not
      # the parent: the tiny precutover manifests/identity/env evidence files
      # sit directly in /home/deploy/transfer-project1/ and MUST stay backed
      # up. The bulk bytes exist in THREE other places: the Supabase source
      # bucket (uploaded + comparator-verified render_only=0, 2026-07-16), the
      # Render disk (alive until migration Phase 4), and this box's own disk
      # (kept). A fourth copy in B2 is what the free cap cannot afford.
      - /home/deploy/transfer-project1/render-only-20260716
      # RECORDED EXCEPTION (founder call 2026-07-25, second B2 free-cap brush -
      # 9.98 of 10 GB stored): reproducible toolchain/build artifacts that
      # post-date this exclude list. A CUDA/PyTorch venv (~4-5 GB) plus Next/
      # turbopack build caches ballooned the source 13.5->20.3 GiB in three
      # days; all of it is derived state whose restore path is
      # reinstall/rebuild (pip install / next build), same class as
      # node_modules above.
      - "**/.venv"
      - "**/.next"
      - "**/.next-dev"
      # Claude Code retains every downloaded version binary (~0.25 GB each,
      # accretes forever); restore path = the installer re-downloads current.
      - /home/deploy/.local/share/claude/versions
      # RECORDED EXCEPTION (B2 free-cap incident #3, 2026-08-01): Chrome's
      # component updater silently downloaded its on-device AI model
      # (OptGuideOnDeviceModel/weights.bin, 2.7 GiB) into thalon's portal
      # profile on 07-29 - the +2.9 GiB one-day balloon that pushed the
      # account to 11.2 GiB and hard-blocked all uploads. All four dirs are
      # Chrome-managed re-downloadable component/model stores (same class as
      # node_modules); the ~50 MiB of real profile state (logins/prefs)
      # stays in the set.
      - /home/deploy/.config/thalon-portal-chrome/OptGuideOnDeviceModel
      - /home/deploy/.config/thalon-portal-chrome/optimization_guide_model_store
      - /home/deploy/.config/thalon-portal-chrome/component_crx_cache
      - /home/deploy/.config/thalon-portal-chrome/WasmTtsEngine
    exclude-caches: true
    # 2026-07-17: syd4 gained its FIRST stateful workload - thalon's native dev
    # Postgres 17 (founder-approved live; provisioning/host/setup-dev-postgres.sh).
    # PGDATA under /var/lib/postgresql is deliberately NOT a source: a file-level
    # copy of a live cluster is not consistent - the same reason dokploy-postgres
    # and thalon's PGlite are dumped, not copied. 40-dev-postgres-dump lands a
    # consistent dump in /home/deploy/pg-dumps, which IS inside the source above.
    # The docker-dependent fleet hooks SELF-SKIP here (no docker on cockpit-class),
    # so run-parts is safe on this box - that guard is what makes this line safe.
    run-before: "run-parts --exit-on-error /etc/resticprofile/pre-backup.d"
    run-after: "/etc/resticprofile/hc-ping.sh success"
    run-after-fail: "/etc/resticprofile/hc-ping.sh fail"
    schedule: "*-*-* 15:00:00"
    schedule-permission: system
    schedule-lock-wait: 15m

  retention:
    after-backup: true
    keep-daily: 7
    keep-weekly: 4
    keep-monthly: 6
    prune: false

  check:
    read-data-subset: "10%"
    run-after-fail: "/etc/resticprofile/hc-ping.sh fail"
    schedule: "Sun *-*-* 17:00:00"
    schedule-permission: system
    schedule-lock-wait: 15m

  prune:
    run-after-fail: "/etc/resticprofile/hc-ping.sh fail"
    schedule: "Sat *-*-* 17:00:00"
    schedule-permission: system
    schedule-lock-wait: 15m
