#cloud-config
# provisioning/cloud-init/syd4.yaml - portfolio workspace box (BinaryLane,
# Ubuntu 24.04 LTS). Purchased at the 2026-07-10 founder gate (std-4vcpu,
# AUD 39.20/mo): the dev workspace replacing the IT-locked Windows laptop -
# all project repos + the research vault + agent sessions live here; the
# founder drives it from a terminal/browser over SSH.
# Runbook: provisioning/binarylane/create-box.ps1 -Name syd4.swordfish.cfd
#          -Size std-4vcpu -CloudInit this.
#
# Design notes (why, not what) - inherits the cockpit class from syd3.yaml:
# - NO Docker (workloads run on fleet boxes; images build in CI), ufw 22 ONLY.
# - code-server (VS Code in the browser) binds 127.0.0.1:8080 with --auth none:
#   the SSH tunnel IS the authentication (ssh -L 8080:localhost:8080). Never
#   open 8080/443 for it; assert-cockpit.sh checks the bind stays localhost.
# - Codex CLI installed alongside Claude Code (founder uses both harnesses);
#   claude-code is the NATIVE user-space build under ~deploy/.local - a root
#   npm -g install can never self-update as deploy (2026-07-13).
# - BinaryLane image quirks (learned on syd2): ships NO swapfile (converge
#   guard below creates 2G) and a local timezone (pinned Etc/UTC here).
# - Same two authorized keys as the fleet: swordfish-ops + swordfish-ci.

hostname: syd4
fqdn: syd4.swordfish.cfd
manage_etc_hosts: true

timezone: Etc/UTC

ssh_pwauth: false

users:
  - name: deploy
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAnQtAgKb8Do+rQwDyUxj9PbBsveE3ztqCM134y7EG0y swordfish-ops
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOOQNhU2jU6VuFQIoHpfTVnLSRY4+5KX3/QY/CUvTOCs swordfish-ci

package_update: true
package_upgrade: true
packages:
  - ufw
  - fail2ban
  - unattended-upgrades
  - ca-certificates
  - curl
  - git
  - tmux
  - ripgrep
  - jq
  - unzip
  - build-essential
  # qrencode: OAuth flows print a URL the founder's museum-grade browser can't
  # open - `qrencode -t ANSIUTF8 '<url>'` puts it on screen for the phone camera
  - qrencode

write_files:
  # key-only, no-root sshd (authoritative over image drop-ins; see syd1.yaml)
  - path: /etc/ssh/sshd_config.d/00-swordfish-hardening.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      AllowUsers deploy
      MaxAuthTries 3
      X11Forwarding no

  # sshd crypto floor (fleet baseline; ssh-audit [fail]-clean)
  - path: /etc/ssh/sshd_config.d/01-swordfish-crypto.conf
    permissions: "0644"
    content: |
      KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
      HostKeyAlgorithms ssh-ed25519,rsa-sha2-512,rsa-sha2-256
      Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr
      MACs hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,umac-128-etm@openssh.com

  # old-laptop friendliness: server-side keepalives - home-router NAT can no
  # longer reap idle sessions (the founder drives this box from a 2011 MacBook)
  - path: /etc/ssh/sshd_config.d/02-swordfish-keepalive.conf
    permissions: "0644"
    content: |
      ClientAliveInterval 60
      ClientAliveCountMax 10

  # code-server perf preset: what makes VS Code render well on a 2011 CPU.
  # Dark theme pinned here (founder 2026-07-13) - these are MACHINE-level user
  # settings, so every project the dashboard opens comes up dark; without the
  # pin a fresh box would follow the browser's light/dark hint instead.
  # The theme id MUST be "Dark Modern" - that is code-server's id (see its
  # theme-defaults extension); MS VS Code's "Default Dark Modern" does not
  # resolve here and would silently fall back.
  - path: /home/deploy/.local/share/code-server/User/settings.json
    owner: deploy:deploy
    defer: true
    permissions: "0644"
    content: |
      {
        "telemetry.telemetryLevel": "off",
        "editor.minimap.enabled": false,
        "editor.smoothScrolling": false,
        "editor.cursorSmoothCaretAnimation": "off",
        "workbench.list.smoothScrolling": false,
        "files.autoSave": "afterDelay",
        "workbench.colorTheme": "Dark Modern",
        "window.autoDetectColorScheme": false,
        "workbench.preferredDarkColorTheme": "Dark Modern",
        "terminal.integrated.defaultProfile.linux": "agent",
        "terminal.integrated.profiles.linux": {
          "agent": { "path": "/usr/local/bin/agent-term" },
          "bash": { "path": "/bin/bash" }
        }
      }

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

  # pre-dawn Sydney reboot window (18:30 UTC), fleet-consistent
  - path: /etc/apt/apt.conf.d/52-swordfish-reboot
    permissions: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
      Unattended-Upgrade::Automatic-Reboot-Time "18:30";

  - path: /etc/sysctl.d/99-swordfish-swap.conf
    permissions: "0644"
    content: |
      vm.swappiness=10

  # sshd jail; systemd journal backend (no rsyslog on 24.04 cloud images)
  - path: /etc/fail2ban/jail.local
    permissions: "0644"
    content: |
      [DEFAULT]
      backend = systemd
      bantime = 1h
      findtime = 10m
      maxretry = 5

      [sshd]
      enabled = true

  # code-server: tunnel-only by construction (localhost bind + no auth layer -
  # the SSH tunnel is the auth; ufw/provider firewall never expose 8080).
  # Subdomain proxying for app previews (2026-07-16): the /proxy/<port>/
  # subpath form breaks apps that emit root-absolute asset URLs (Next.js
  # /_next/...) - unstyled pages. Dual --proxy-domain, ORDER MATTERS:
  # localhost:8080 FIRST (browsers send Host WITH the port and code-server
  # matches it verbatim; first entry also becomes VSCODE_PROXY_URI so
  # Ports-tab links carry :8080), portless localhost second (compat).
  # Preview pattern for ANY app port: http://<port>.localhost:8080.
  # CANONICAL: provisioning/host/setup-qol.sh (this is the lockstep copy);
  # regression check: provisioning/checks/assert-agent-seams.sh.
  - path: /etc/systemd/system/code-server.service
    permissions: "0644"
    content: |
      [Unit]
      Description=code-server (VS Code in the browser) - SSH-tunnel-only
      After=network.target

      [Service]
      User=deploy
      ExecStart=/usr/bin/code-server --bind-addr 127.0.0.1:8080 --auth none --proxy-domain localhost:8080 --proxy-domain localhost
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

  # agent-tmux: the tmux server as its OWN unit, outside code-server's cgroup.
  # 2026-07-16 incident: the server used to be spawned by the first agent-term
  # terminal, i.e. INSIDE code-server.service's cgroup - a code-server restart
  # killed every agent session on the box. CANONICAL: setup-qol.sh (lockstep).
  - path: /etc/systemd/system/agent-tmux.service
    permissions: "0644"
    content: |
      [Unit]
      Description=agent tmux server - persistent seam for all agent sessions
      # invariant: must NEVER be merged into / made dependent on code-server -
      # surviving code-server restarts is this unit's entire reason to exist
      After=network.target

      [Service]
      User=deploy
      Type=simple
      ExecStart=/usr/bin/tmux -D
      # sessions inherit the SERVER's env: ~/.local/bin carries the
      # self-updating claude build that agent-term auto-starts
      Environment=PATH=/home/deploy/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

  # quality-of-life (applied live to syd3+syd4 2026-07-10 - keep in lockstep):
  # one-word workspace, QR helper for phone-OAuth, backup one-liners
  - path: /etc/profile.d/swordfish-qol.sh
    permissions: "0644"
    content: |
      # swordfish fleet quality-of-life. CANONICAL: provisioning/host/setup-qol.sh
      # (cloud-init carries a lockstep copy for first boot). Non-login shells get
      # this file via the /etc/bash.bashrc hook the same script installs.
      # self-updating user-space tools (claude native build) live in ~/.local/bin
      case ":$PATH:" in
        *":$HOME/.local/bin:"*) ;;
        *) [ -d "$HOME/.local/bin" ] && PATH="$HOME/.local/bin:$PATH" ;;
      esac
      # protocol: sessions launch inside the swordfish repo (the memory slug
      # attaches to the launch dir - a $HOME launch comes up empty).
      # Session named after the FOLDER so `work` over ssh and a code-server
      # terminal tab (agent-term) converge on the same session, never two agents.
      work() {
        local d="$HOME/work/swordfish"; [ -d "$d" ] || d="$HOME"
        tmux new -A -s "$(basename "$d")" -c "$d"
      }
      qr() { qrencode -t ANSIUTF8 "$1"; }
      # copy: put a file's (or piped) content into the FOUNDER'S MAC CLIPBOARD
      # through the browser terminal (OSC52; code-server forwards it, tmux needs
      # the passthrough wrap + allow-passthrough in tmux.conf). Box->Mac copy via
      # text selection is unreliable in a live TUI (redraws drop the selection) -
      # this is the mechanical path. Big content (>~50KB) still goes via a file
      # opened in the editor. `copytest` = 3-second founder verification.
      copy() {
        local data
        if [ $# -ge 1 ]; then data=$(base64 -w0 < "$1") || return 1
        else data=$(base64 -w0); fi
        if [ -n "${TMUX:-}" ]; then
          printf '\033Ptmux;\033\033]52;c;%s\007\033\\' "$data"
        else
          printf '\033]52;c;%s\007' "$data"
        fi
      }
      copytest() {
        printf 'clipboard works: %s' "$(date '+%H:%M:%S')" | copy
        echo "sent - now paste (Cmd+V) into any Mac app; you should get 'clipboard works: <time>'"
      }
      alias snapshots='sudo resticprofile -c /etc/resticprofile/profiles.yaml --name "$(hostname -s)" snapshots'
      alias backup-now='sudo resticprofile -c /etc/resticprofile/profiles.yaml --name "$(hostname -s)" backup'

  # agent-term: code-server's default terminal profile (wired in settings.json
  # above). Lands every terminal in a tmux session named after the workspace
  # folder - a window crash never kills the agent; reopening the tab
  # reattaches. The tmux server itself runs under agent-tmux.service (above),
  # which agent-term ensures before attaching - never in this terminal's
  # cgroup. CANONICAL: provisioning/host/setup-qol.sh (lockstep copy).
  - path: /usr/local/bin/agent-term
    permissions: "0755"
    content: |
      #!/bin/bash
      d="$PWD"
      # protocol: never launch the agent at $HOME (empty memory slug)
      [ "$d" = "$HOME" ] && [ -d "$HOME/work/swordfish" ] && d="$HOME/work/swordfish"
      s=$(printf '%s' "$(basename "$d")" | tr -cs 'A-Za-z0-9_-' '-')
      s=${s#-}; s=${s%-}; [ -n "$s" ] || s=agent
      # the shared tmux server must run under agent-tmux.service, never this
      # terminal's cgroup (a code-server restart killed every agent 2026-07-16)
      systemctl is-active --quiet agent-tmux || sudo -n systemctl start agent-tmux 2>/dev/null || true
      exec tmux new-session -A -s "$s" -c "$d" \
        'claude; echo; echo "[claude exited - type claude to relaunch, or claude --continue to resume the last conversation]"; exec bash'

  # CANONICAL: provisioning/host/setup-qol.sh (this is the lockstep copy)
  - path: /etc/tmux.conf
    permissions: "0644"
    content: |
      # mouse OFF by default: tmux mouse mode captures the terminal's mouse,
      # which kills native macOS Terminal selection/copy (rehearsal lesson
      # 2026-07-11 - an OAuth URL could not be copied). prefix+m toggles it
      # for wheel scrolling; native selection is the primary copy path.
      set -g mouse off
      bind m set -g mouse \; display 'tmux mouse: #{?mouse,ON (wheel scroll; selection captured),off (native selection works)}'
      set -g history-limit 50000
      set -g status-interval 5
      set -g status-right "#H | %H:%M UTC"
      # clipboard: let OSC52 escape from inside tmux to the outer terminal, so the
      # `copy` QoL command lands content in the founder's Mac clipboard (2026-07-13)
      set -g allow-passthrough on
      set -s set-clipboard external
      # founder request 2026-07-11: black background everywhere (matches VS Code)
      set -g window-style 'fg=colour252,bg=black'
      set -g window-active-style 'fg=colour252,bg=black'
      set -g status-style 'bg=colour235,fg=colour246'

  # login banner = the crib sheet (VS Code lines appear only where code-server exists)
  - path: /etc/update-motd.d/99-swordfish
    permissions: "0755"
    content: |
      #!/bin/sh
      h=$(hostname -s)
      echo ""
      echo " == $h.swordfish.cfd ================================================="
      echo "  work          open/resume the main workspace (survives WiFi drops)"
      echo "  claude        start the agent (run it inside 'work')"
      if [ -f /etc/systemd/system/code-server.service ]; then
      echo "  READ + COPY in VS Code (Chromium) - terminal copy dies on redraws:"
      echo "     Mac: ssh -L 8080:localhost:8080 deploy@$h.swordfish.cfd -> http://localhost:8080"
      echo "     command sheet: ~/migration/MAC-COMMANDS.txt (open it there)"
      fi
      echo "  copy text     select + Cmd+C works ONLY while the screen is still"
      echo "  qr '<url>'    render any URL as a QR code for the phone camera"
      echo "  snapshots     list backups   |   backup-now   run a backup now"
      echo "  heads-up: box may auto-reboot ~04:30 Sydney after security patches"
      echo " ====================================================================="
      echo ""

runcmd:
  # --- firewall: default-deny, allow 22 BEFORE enable (lockout guard). 22 only ---
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw --force enable

  # --- neutralize any image drop-in that re-enables password auth ---
  - for f in /etc/ssh/sshd_config.d/*.conf; do [ "$f" = "/etc/ssh/sshd_config.d/00-swordfish-hardening.conf" ] || sed -i 's/^\s*PasswordAuthentication\s\+yes/PasswordAuthentication no/' "$f"; done
  - systemctl restart ssh

  # --- jail + patching services on ---
  - systemctl enable --now fail2ban
  - systemctl enable --now unattended-upgrades

  # --- locales the founder's Mac sends over SSH (kills setlocale warning noise) ---
  - locale-gen en_AU.UTF-8 en_US.UTF-8

  # --- QoL for NON-login shells: profile.d only reaches login shells, and
  #     code-server integrated terminals are non-login (lesson 2026-07-13).
  #     Lockstep with provisioning/host/setup-qol.sh (the canonical converge). ---
  - |
    grep -qF '/etc/profile.d/swordfish-qol.sh' /etc/bash.bashrc || cat >> /etc/bash.bashrc <<'EOF'

    # swordfish: profile.d only reaches login shells; code-server terminals are
    # interactive non-login (2026-07-13). QoL stays in one file, hooked in here.
    [ -f /etc/profile.d/swordfish-qol.sh ] && . /etc/profile.d/swordfish-qol.sh
    EOF

  # --- swapfile: BinaryLane images ship NONE (syd2 datapoint) - converge guard ---
  - swapon --show=NAME --noheadings | grep -qx /swapfile || { fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048 status=none; chmod 600 /swapfile; mkswap /swapfile; swapon /swapfile; }
  - grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - sysctl -q vm.swappiness=10

  # --- dev toolchain: gh (official apt repo), Node 22 (NodeSource), agent
  #     harnesses via npm. NodeSource fetch is download-then-execute WITH
  #     retries: on syd4's first boot the piped `curl -fsS | bash` failed
  #     SILENTLY (empty pipe = bash success) and apt fell back to Ubuntu's
  #     node 18 with no npm - the smoke caught it (run 29093898747) ---
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
  - chmod a+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
  - curl -fsSL --retry 5 --retry-all-errors -o /tmp/nodesource.sh https://deb.nodesource.com/setup_22.x
  - bash /tmp/nodesource.sh
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y gh nodejs python3-pip python3-venv
  - npm install -g @openai/codex

  # --- Go toolchain: pinned tarball, sha256-verified (apt's golang lags;
  #     portfolio CI builds on go 1.26). Bump = move the pin + hash here. ---
  - curl -fsSL --retry 3 -o /tmp/go.tgz https://go.dev/dl/go1.26.5.linux-amd64.tar.gz
  - echo "5c2c3b16caefa1d968a94c1daca04a7ca301a496d9b086e17ad77bb81393f053  /tmp/go.tgz" | sha256sum -c -
  - tar -C /usr/local -xzf /tmp/go.tgz
  - ln -sf /usr/local/go/bin/go /usr/local/bin/go
  - ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt

  # --- claude-code: native user-space build (download-then-execute, same
  #     rationale as the NodeSource fetch above). Root npm -g broke self-update
  #     forever ("no write permission to npm prefix", founder-hit 2026-07-13).
  #     The /usr/local/bin symlink keeps non-interactive SSH contexts
  #     (assert-cockpit `command -v claude`) working without PATH games. ---
  - curl -fsSL --retry 5 --retry-all-errors -o /tmp/claude-install.sh https://claude.ai/install.sh
  - sudo -u deploy -H bash /tmp/claude-install.sh
  - ln -sf /home/deploy/.local/bin/claude /usr/local/bin/claude

  # --- code-server via the official pinned .deb (sha256-verified, phase7
  #     pattern): the npm build needs --unsafe-perm and a postinstall compile -
  #     the release binary is the supported path. Bump = move the pin here. ---
  - curl -fsSL --retry 3 -o /tmp/code-server.deb https://github.com/coder/code-server/releases/download/v4.127.0/code-server_4.127.0_amd64.deb
  - echo "a1cb96f64d5c68736764726cd3b0c9b6e500bdc30cfefebc05f59259149380e2  /tmp/code-server.deb" | sha256sum -c -
  - dpkg -i /tmp/code-server.deb
  - systemctl daemon-reload
  - systemctl enable --now agent-tmux
  - systemctl enable --now code-server

  # --- PowerShell 7: the repo's operational scripts (grep guard, DNS, box
  #     create/firewall) are .ps1 by design ("runs on pwsh 7+") - a cockpit
  #     that can't run them can't operate the fleet ---
  - curl -fsSL --retry 3 -o /tmp/pmc.deb https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
  - dpkg -i /tmp/pmc.deb
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y powershell

  # --- POST-BOOT (not cloud-init-reproducible): SSH-login alerts to the
  #     founder's Telegram land via the alerts-apply workflow - its secrets
  #     env file (/etc/swordfish/alerts.env) can never be pinned here. On any
  #     rebuild, dispatch alerts-apply against this host after first boot.
  #     Layer: provisioning/host/setup-login-alerts.sh (2026-07-11).
  #     ALSO post-boot (needs the repo cloned first): the live founder
  #     dashboard - run provisioning/workstation/setup-dashboard.sh
  #     (regen timer + localhost-only 8090 server, reached via
  #     code-server's /proxy/8090/ through the Mac tunnel; 2026-07-13). ---
