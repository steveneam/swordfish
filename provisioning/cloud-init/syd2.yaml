#cloud-config
# provisioning/cloud-init/syd2.yaml - Bucket 5 (Stage 2), graduate-by-migrating.
# Hardened-at-first-boot user-data for the syd2 shared box (BinaryLane Sydney,
# Standard 4 vCPU / 8 GB / 100 GB NVMe - CHARTER.md Bucket-4 checkpoint ruling 2).
# Runbook: pasted into the BinaryLane purchase form's cloud-init user-data field
# (single founder touch - see provisioning/binarylane/syd2-purchase-step-card.md);
# the BinaryLane API token only exists post-purchase, so first create is the form,
# everything after is scripted via provisioning/binarylane/.
#
# Design notes (why, not what) - adapted from syd1.yaml, kept in lockstep:
# - UBUNTU 24.04 LTS ONLY. The Docker apt line pins suite `noble`, and fail2ban's
#   systemd backend assumes 24.04 cloud images (no rsyslog). BinaryLane defaults
#   to 26.04 - the step-card makes the founder select 24.04 explicitly.
# - All hardening lands BEFORE the box is first reachable, so the playbook's two
#   classic lockout gates (password-off, ufw enable) are resolved in code: keys
#   are baked in ahead of sshd hardening, and 22/tcp is allowed ahead of enable.
# - sshd drop-in is 00-prefixed: OpenSSH keyword semantics are first-value-wins
#   and sshd_config.d is included lexically ahead of the main body, so 00- beats
#   the image's 50-cloud-init.conf and any provider default.
# - Two authorized keys: swordfish-ops (founder laptop, break-glass via hotspot;
#   outbound 22 is blocked on the corporate network) and swordfish-ci (GitHub
#   Actions runner - the CI-as-hands channel, CHARTER.md decision 2).
# - Bucket-2 host-layer pre-steps (daemon.json, reboot window, swap) are mirrored
#   from provisioning/host/phase2-host.sh so a rebuilt box lands converged at
#   first boot - keep this file, that script, and assert-hardening.sh in lockstep.
# - Swap: unlike the Vultr image (which shipped an active /swapfile), assume the
#   BinaryLane image ships none - the converge guard below creates a 2G /swapfile
#   if absent, and is a no-op if the image surprises us with one. Verify which
#   way it went on first smoke and record it in inventory/boxes.md.

hostname: syd2
fqdn: syd2.swordfish.cfd
manage_etc_hosts: true

ssh_pwauth: false

users:
  - name: deploy
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAnQtAgKb8Do+rQwDyUxj9PbBsveE3ztqCM134y7EG0y swordfish-ops
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOOQNhU2jU6VuFQIoHpfTVnLSRY4+5KX3/QY/CUvTOCs swordfish-ci

package_update: true
package_upgrade: true
packages:
  - ufw
  - fail2ban
  - unattended-upgrades
  - ca-certificates
  - curl

write_files:
  # key-only, no-root sshd. First-value-wins + lexical include order = this file
  # is authoritative over 50-cloud-init.conf and the image's main sshd_config.
  - path: /etc/ssh/sshd_config.d/00-swordfish-hardening.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      AllowUsers deploy
      MaxAuthTries 3
      X11Forwarding no

  # Bucket-2 host layer (mirror of phase2-host.sh): sshd crypto floor. Stock
  # OpenSSH offers NIST-curve kex + hmac-sha1 - ssh-audit grades those [fail]
  # and the smoke workflow gates on them.
  - path: /etc/ssh/sshd_config.d/01-swordfish-crypto.conf
    permissions: "0644"
    content: |
      KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
      HostKeyAlgorithms ssh-ed25519,rsa-sha2-512,rsa-sha2-256
      Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr
      MACs hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,umac-128-etm@openssh.com

  # unattended-upgrades: actually turn the timer behaviour on (the package
  # alone does nothing without APT::Periodic).
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

  # Bucket-2 pre-steps (mirror of phase2-host.sh): log caps. NO live-restore -
  # the daemon refuses swarm init with it set (hit live on syd1 2026-07-07) and
  # the Dokploy control plane is swarm-based (ADR 0001).
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }

  # Bucket-2 pre-steps: unattended-upgrades may reboot in the pre-dawn Sydney
  # window (18:30 UTC = 04:30 AEST / 05:30 AEDT; box clock stays UTC).
  - path: /etc/apt/apt.conf.d/52-swordfish-reboot
    permissions: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
      Unattended-Upgrade::Automatic-Reboot-Time "18:30";

  # Bucket-2 pre-steps: swap is a safety net, not a working set.
  - path: /etc/sysctl.d/99-swordfish-swap.conf
    permissions: "0644"
    content: |
      vm.swappiness=10

  # sshd jail; systemd journal backend (no rsyslog on 24.04 cloud images).
  - path: /etc/fail2ban/jail.local
    permissions: "0644"
    content: |
      [DEFAULT]
      backend = systemd
      bantime = 1h
      findtime = 10m
      maxretry = 5

      [sshd]
      enabled = true

runcmd:
  # --- Docker + compose plugin, official apt repo (playbook Phase 3 prereq;
  #     installed now so the edge/control-plane converge lands on a ready
  #     engine). Suite pinned to noble = the Ubuntu 24.04-ONLY constraint. ---
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker deploy

  # --- firewall: default-deny, allow 22 BEFORE enable (lockout guard) ---
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

  # --- neutralize any provider/image drop-in that re-enables password auth,
  #     then apply the hardened sshd config ---
  - for f in /etc/ssh/sshd_config.d/*.conf; do [ "$f" = "/etc/ssh/sshd_config.d/00-swordfish-hardening.conf" ] || sed -i 's/^\s*PasswordAuthentication\s\+yes/PasswordAuthentication no/' "$f"; done
  - systemctl restart ssh

  # --- jail + patching services on ---
  - systemctl enable --now fail2ban
  - systemctl enable --now unattended-upgrades

  # --- Bucket-2 pre-steps: swapfile (mirror of phase2-host.sh). Converge, don't
  #     duplicate: creates 2G swap only if /swapfile is not already active
  #     (Vultr's image shipped one; BinaryLane's is assumed not to - verify on
  #     first smoke) ---
  - swapon --show=NAME --noheadings | grep -qx /swapfile || { fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048 status=none; chmod 600 /swapfile; mkswap /swapfile; swapon /swapfile; }
  - grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - sysctl -q vm.swappiness=10
