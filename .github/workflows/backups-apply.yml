name: backups-apply

# CI-as-hands apply channel for the Bucket-3 backup layer (backups BEFORE
# workloads - invariant): installs the backup secrets as 0600 root files, ships
# provisioning/backup to the box, converges with
# provisioning/host/phase7-backups.sh (pinned restic + resticprofile, systemd
# timers), proves idempotency, runs a first real backup end-to-end (which also
# fires the dead-man success ping), then re-asserts the full hardening posture.
# Dispatch-only - a human decides when a live box changes.
# Requires repo secrets SSH_DEPLOY_KEY, RESTIC_PASSWORD, RESTIC_B2_KEY_ID,
# RESTIC_B2_KEY; HEALTHCHECKS_PING_URL and KUMA_PUSH_URL are each optional
# (hc-ping warns per run for any missing receiver) - together they are the
# dead-man's two halves: off-infra witness + on-infra Kuma push (Bucket 4).

on:
  workflow_dispatch:
    inputs:
      host:
        description: Box FQDN or IP
        required: false
        default: syd1.swordfish.cfd
      test_deadman:
        description: Test-fire the dead-man alert (ping /fail, then success to clear)
        required: false
        type: boolean
        default: false
      install_ping_urls:
        description: Install the dead-man ping URLs from repo secrets (set false for a parallel-run successor box until it has its OWN receivers - the secrets hold the incumbent box's URLs and sharing them makes acks ambiguous)
        required: false
        type: boolean
        default: true
      deploy_fqdn:
        description: Control-plane FQDN the posture re-assert probes (parallel-run boxes carry a temp name until DNS cutover)
        required: false
        default: deploy.swordfish.cfd

# this job holds the box SSH key - keep its GITHUB_TOKEN read-only so a
# compromised step can't also write to the repo (Bucket 1.5 posture)
permissions:
  contents: read

jobs:
  apply:
    name: converge backup layer via SSH
    runs-on: ubuntu-latest
    env:
      HOST: ${{ inputs.host || 'syd1.swordfish.cfd' }}
      DEPLOY_FQDN: ${{ inputs.deploy_fqdn || 'deploy.swordfish.cfd' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install CI deploy key
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          [ -n "$SSH_DEPLOY_KEY" ] || { echo "SSH_DEPLOY_KEY secret is not set"; exit 1; }
          mkdir -p ~/.ssh
          # strip CRs defensively: a secret pasted/piped from Windows once arrived
          # CR-tainted and openssh fails it with "error in libcrypto" (2026-07-07)
          printf '%s\n' "$SSH_DEPLOY_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "secret does not parse as a private key"; exit 1; }

      - name: Wait for SSH
        run: |
          for i in $(seq 1 10); do
            if ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o BatchMode=yes "deploy@$HOST" true; then
              echo "SSH reachable"; exit 0
            fi
            echo "attempt $i/10 - not reachable yet, retrying in 30s"; sleep 30
          done
          echo "SSH unreachable after 5 minutes"; exit 1

      - name: Install backup secrets on box (0600 root)
        env:
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          RESTIC_B2_KEY_ID: ${{ secrets.RESTIC_B2_KEY_ID }}
          RESTIC_B2_KEY: ${{ secrets.RESTIC_B2_KEY }}
          HC_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
          KUMA_URL: ${{ secrets.KUMA_PUSH_URL }}
          INSTALL_PINGS: ${{ inputs.install_ping_urls }}
        run: |
          [ -n "$RESTIC_PASSWORD" ] || { echo "RESTIC_PASSWORD secret is not set"; exit 1; }
          { [ -n "$RESTIC_B2_KEY_ID" ] && [ -n "$RESTIC_B2_KEY" ]; } || { echo "RESTIC_B2_KEY_ID / RESTIC_B2_KEY secrets are not set"; exit 1; }
          s() { ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o BatchMode=yes "deploy@$HOST" "$@"; }
          s 'sudo install -d -m 700 /etc/resticprofile'
          printf '%s\n' "$RESTIC_PASSWORD" | tr -d '\r' | \
            s 'sudo tee /etc/resticprofile/password.txt >/dev/null && sudo chmod 600 /etc/resticprofile/password.txt'
          printf 'B2_ACCOUNT_ID=%s\nB2_ACCOUNT_KEY=%s\n' "$RESTIC_B2_KEY_ID" "$RESTIC_B2_KEY" | tr -d '\r' | \
            s 'sudo tee /etc/resticprofile/b2.env >/dev/null && sudo chmod 600 /etc/resticprofile/b2.env'
          if [ "$INSTALL_PINGS" != "true" ]; then
            echo "SKIPPED: ping URLs not installed (install_ping_urls=false - parallel-run box gets its own receivers later; hc-ping warns per run until then)"
          else
            if [ -n "$HC_URL" ]; then
              printf '%s\n' "$HC_URL" | tr -d '\r' | \
                s 'sudo tee /etc/resticprofile/hc-url >/dev/null && sudo chmod 600 /etc/resticprofile/hc-url'
              echo "dead-man URL installed (healthchecks)"
            else
              echo "WARN: HEALTHCHECKS_PING_URL not set - off-infra dead-man ping stays dormant (hc-ping warns per run)"
            fi
            if [ -n "$KUMA_URL" ]; then
              printf '%s\n' "$KUMA_URL" | tr -d '\r' | \
                s 'sudo tee /etc/resticprofile/kuma-url >/dev/null && sudo chmod 600 /etc/resticprofile/kuma-url'
              echo "dead-man URL installed (kuma push)"
            else
              echo "WARN: KUMA_PUSH_URL not set - on-infra dead-man ping stays dormant (hc-ping warns per run)"
            fi
          fi
          echo "secrets installed"

      - name: Ship provisioning/backup to /opt/swordfish/backup
        run: |
          # tar pipe instead of rsync/scp: rsync is not on the box image and this
          # stays one idempotent overwrite with no partial-sync states
          tar -C provisioning -czf - backup | \
            ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
                "deploy@$HOST" 'sudo install -d -o deploy -g deploy /opt/swordfish && tar -C /opt/swordfish -xzf -'

      - name: Converge backup layer (phase7-backups.sh)
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
              "deploy@$HOST" 'bash -s' < provisioning/host/phase7-backups.sh

      - name: Idempotency proof - second run must be a no-op
        run: |
          out=$(ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
                    "deploy@$HOST" 'bash -s' < provisioning/host/phase7-backups.sh)
          echo "$out"
          echo "$out" | grep -q '== converged: no changes' \
            || { echo "FAIL: second run still reported changes - script is not idempotent"; exit 1; }

      - name: First real backup (end-to-end, fires the dead-man ping)
        run: |
          BOX="${HOST%%.*}"
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
              "deploy@$HOST" "sudo resticprofile -c /etc/resticprofile/profiles.yaml --name $BOX backup"

      - name: Evidence - snapshots + timers
        run: |
          BOX="${HOST%%.*}"
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
              "deploy@$HOST" "sudo resticprofile -c /etc/resticprofile/profiles.yaml --name $BOX snapshots && systemctl list-timers 'resticprofile-*' --no-pager"

      - name: Test-fire dead-man alert (opt-in input)
        if: ${{ inputs.test_deadman }}
        run: |
          # /fail flips the check to down (healthchecks notifies the founder),
          # the success ping right after flips it back up - alarm verified, state clean
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
              "deploy@$HOST" 'sudo /etc/resticprofile/hc-ping.sh fail && sleep 5 && sudo /etc/resticprofile/hc-ping.sh success'
          echo "dead-man test-fired - founder should have a notification"

      - name: Re-assert full hardening posture
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
              "deploy@$HOST" "DEPLOY_FQDN=$DEPLOY_FQDN bash -s" < provisioning/checks/assert-hardening.sh
