name: hardening-smoke

# CI-as-hands proof (CHARTER.md decision 2, Bucket 1): a GitHub runner is the
# operational SSH channel - it connects to the box and asserts the Phase 0-2
# hardening actually holds. Requires repo secret SSH_DEPLOY_KEY (the dedicated
# swordfish-ci private key; the founder's laptop key never leaves the laptop).

on:
  workflow_dispatch:
    inputs:
      host:
        description: Box FQDN or IP
        required: false
        default: syd1.swordfish.cfd
      tls_fqdn:
        description: TLS hostname to green-lock probe (empty = skip, e.g. pre-DNS rebuild)
        required: false
        default: deploy.swordfish.cfd

# Bucket 1.5: this job holds the box SSH key - keep its GITHUB_TOKEN read-only
# so a compromised step can't also write to the repo (dispatch-only trigger
# already limits who can run it)
permissions:
  contents: read

jobs:
  smoke:
    name: hardening assertions via SSH
    runs-on: ubuntu-latest
    env:
      HOST: ${{ inputs.host || 'syd1.swordfish.cfd' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install CI deploy key
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          [ -n "$SSH_DEPLOY_KEY" ] || { echo "SSH_DEPLOY_KEY secret is not set"; exit 1; }
          mkdir -p ~/.ssh
          # strip CRs defensively: a secret pasted/piped from Windows once arrived
          # CR-tainted and openssh fails it with "error in libcrypto" (2026-07-07)
          printf '%s\n' "$SSH_DEPLOY_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "secret does not parse as a private key"; exit 1; }

      - name: Wait for SSH (first boot can still be running)
        run: |
          for i in $(seq 1 20); do
            if ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o BatchMode=yes "deploy@$HOST" true; then
              echo "SSH reachable"; exit 0
            fi
            echo "attempt $i/20 - not reachable yet, retrying in 30s"; sleep 30
          done
          echo "SSH unreachable after 10 minutes"; exit 1

      - name: Negative check - password auth refused
        run: |
          set +e
          out=$(ssh -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no \
                    -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o BatchMode=yes \
                    "deploy@$HOST" true 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ $rc -eq 0 ]; then echo "FAIL: password login unexpectedly succeeded"; exit 1; fi
          # the denial list must be publickey-only; 'password' appearing there = sshd misconfig
          echo "$out" | grep -Eq 'Permission denied \(publickey\)\.' \
            || { echo "FAIL: server offers auth methods beyond publickey"; exit 1; }
          echo "PASS: password auth refused, server offers publickey only"

      - name: Negative check - root login refused
        run: |
          if ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o BatchMode=yes \
                 "root@$HOST" true 2>/dev/null; then
            echo "FAIL: root login succeeded"; exit 1
          fi
          echo "PASS: root login refused"

      - name: On-box hardening assertions
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
              "deploy@$HOST" 'bash -s' < provisioning/checks/assert-hardening.sh

      # Bucket 2: sshd crypto posture. Gates on [fail] findings only; [warn]s are
      # printed as the recorded grade (tightening them = a future hardening pass,
      # not a smoke failure - ssh-audit exits non-zero even on warns, hence || true)
      - name: ssh-audit grade
        run: |
          pipx install ssh-audit
          out=$(ssh-audit "$HOST" || true)
          echo "$out"
          if echo "$out" | grep -q '\[fail\]'; then
            echo "FAIL: ssh-audit reports hard failures"; exit 1
          fi
          echo "PASS: no [fail]-level findings"

      # Bucket 2 gate evidence: real certificate chain, verified by the runner's
      # CA store - the CI twin of the founder's green-lock browser check
      - name: TLS green-lock probe
        env:
          TLS_FQDN: ${{ inputs.tls_fqdn }}
        run: |
          if [ -z "$TLS_FQDN" ]; then echo "skipped (no tls_fqdn)"; exit 0; fi
          for i in $(seq 1 10); do
            if curl -sS --max-time 15 "https://$TLS_FQDN" -o /dev/null; then
              echo "PASS: https://$TLS_FQDN presents a CA-valid certificate"; exit 0
            fi
            echo "attempt $i/10 - not valid yet (issuance can take a minute), retrying in 30s"
            sleep 30
          done
          echo "FAIL: no valid certificate after 5 minutes"; exit 1
