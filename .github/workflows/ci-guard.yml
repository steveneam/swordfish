name: ci-guard

on:
  push:
    branches: [main]
  pull_request:

# Bucket 1.5: least-privilege default; no job here needs write access
permissions:
  contents: read

jobs:
  ci-grep-guard:
    name: ci-grep-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Anonymity guard (zero guarded tokens in tracked files)
        shell: pwsh
        run: ./scripts/ci-grep-guard.ps1
