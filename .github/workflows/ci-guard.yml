name: ci-guard

on:
  push:
    branches: [main]
  pull_request:

# Bucket 1.5: least-privilege default; no job here needs write access
permissions:
  contents: read

jobs:
  ci-grep-guard:
    name: ci-grep-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Anonymity guard (zero guarded tokens in tracked files)
        shell: pwsh
        run: ./scripts/ci-grep-guard.ps1
