name: host-apply

# CI-as-hands apply channel (CHARTER.md decision 2): a GitHub runner SSHes to the
# box and converges the host layer with provisioning/host/phase2-host.sh, then
# re-asserts the full hardening posture. Dispatch-only - a human decides when a
# live box changes. Requires repo secret SSH_DEPLOY_KEY (swordfish-ci key).

on:
  workflow_dispatch:
    inputs:
      host:
        description: Box FQDN or IP
        required: false
        default: syd1.swordfish.cfd
      deploy_fqdn:
        description: Control-plane FQDN the posture re-assert probes (parallel-run boxes carry a temp name until DNS cutover)
        required: false
        default: deploy.swordfish.cfd

# this job holds the box SSH key - keep its GITHUB_TOKEN read-only so a
# compromised step can't also write to the repo (Bucket 1.5 posture)
permissions:
  contents: read

jobs:
  apply:
    name: converge host layer via SSH
    runs-on: ubuntu-latest
    env:
      HOST: ${{ inputs.host || 'syd1.swordfish.cfd' }}
      DEPLOY_FQDN: ${{ inputs.deploy_fqdn || 'deploy.swordfish.cfd' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install CI deploy key
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          [ -n "$SSH_DEPLOY_KEY" ] || { echo "SSH_DEPLOY_KEY secret is not set"; exit 1; }
          mkdir -p ~/.ssh
          # strip CRs defensively: a secret pasted/piped from Windows once arrived
          # CR-tainted and openssh fails it with "error in libcrypto" (2026-07-07)
          printf '%s\n' "$SSH_DEPLOY_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "secret does not parse as a private key"; exit 1; }

      - name: Wait for SSH
        run: |
          for i in $(seq 1 10); do
            if ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o BatchMode=yes "deploy@$HOST" true; then
              echo "SSH reachable"; exit 0
            fi
            echo "attempt $i/10 - not reachable yet, retrying in 30s"; sleep 30
          done
          echo "SSH unreachable after 5 minutes"; exit 1

      - name: Converge host layer (phase2-host.sh)
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
              "deploy@$HOST" 'bash -s' < provisioning/host/phase2-host.sh

      - name: Idempotency proof - second run must be a no-op
        run: |
          out=$(ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
                    "deploy@$HOST" 'bash -s' < provisioning/host/phase2-host.sh)
          echo "$out"
          echo "$out" | grep -q '== converged: no changes' \
            || { echo "FAIL: second run still reported changes - script is not idempotent"; exit 1; }

      - name: Re-assert full hardening posture
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
              "deploy@$HOST" "DEPLOY_FQDN=$DEPLOY_FQDN bash -s" < provisioning/checks/assert-hardening.sh
