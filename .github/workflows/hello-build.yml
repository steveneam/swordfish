name: hello-build

# Bucket 4: builds the hello dogfood image in CI and pushes to GHCR - the
# laptop never builds images (AGENTS.md rule 1). The image bar (non-root +
# HEALTHCHECK reaching healthy + the page actually serving) is asserted ON THE
# RUNNER before anything is pushed, so a broken image can never reach a box.
# Deploys consume the digest printed in the step summary (digest-pinned in
# Dokploy; Renovate maintains pins from there).

on:
  push:
    branches: [main]
    paths:
      - apps/hello/**
      - .github/workflows/hello-build.yml
  workflow_dispatch:

# packages: write is the push credential; keep contents read-only so a
# compromised step can't write to the repo (Bucket 1.5 posture)
permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build + smoke-test + push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute image ref
        run: |
          # GHCR requires a lowercase namespace; ${VAR,,} keeps this fork-safe
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/swordfish-hello" >> "$GITHUB_ENV"
          echo "TAG=sha-${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

      - name: Build
        run: |
          docker build \
            --build-arg VERSION="${GITHUB_SHA::12}" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            -t "$IMAGE:$TAG" -t "$IMAGE:latest" \
            apps/hello

      - name: Smoke test - image bar asserted before push
        run: |
          docker run -d --name hello -p 8080:8080 "$IMAGE:$TAG"
          user=$(docker inspect -f '{{.Config.User}}' hello)
          [ "$user" = "65534:65534" ] || { echo "FAIL: runs as '$user', not 65534:65534"; exit 1; }
          state=starting
          for i in $(seq 1 10); do
            state=$(docker inspect -f '{{.State.Health.Status}}' hello)
            echo "health: $state"
            [ "$state" = healthy ] && break
            sleep 3
          done
          [ "$state" = healthy ] || { docker logs hello; echo "FAIL: never went healthy"; exit 1; }
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/ | grep -q "swordfish" || { echo "FAIL: page did not render"; exit 1; }
          docker rm -f hello

      - name: Push + record digest
        run: |
          out=$(docker push "$IMAGE:$TAG")
          echo "$out"
          docker push "$IMAGE:latest"
          digest=$(echo "$out" | sed -n 's/.*digest: \(sha256:[a-f0-9]*\).*/\1/p')
          [ -n "$digest" ] || { echo "FAIL: could not extract pushed digest"; exit 1; }
          {
            echo "### swordfish-hello pushed"
            echo '```'
            echo "$IMAGE:$TAG@$digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
