name: zizmor

# Bucket 1.5 (CI supply-chain hardening): static analysis of the workflows
# themselves - unpinned actions, template injection, credential persistence,
# excessive permissions. Context: the CI runner holds the box SSH key, so a
# compromised action is a box compromise (research 2026-07-07 §6).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  zizmor:
    name: workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.26.1" # pin the zizmor binary too; Renovate maintains
          # private repo without Advanced Security: no SARIF upload -
          # findings land in the log + PR annotations and fail the job
          advanced-security: "false"
          annotations: "true"
