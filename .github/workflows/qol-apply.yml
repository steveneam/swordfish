name: qol-apply

# CI-as-hands apply channel for the fleet shell QoL layer
# (provisioning/host/setup-qol.sh - `work` & friends visible to non-login
# shells; profile.d alone is a login-shell trap, lesson 2026-07-13). This is
# the sanctioned path to boxes the cockpit cannot SSH to (syd2's inbound 22
# only answers the CI runners). Dispatch-only.

on:
  workflow_dispatch:
    inputs:
      host:
        description: Target FQDN
        required: false
        default: syd4.swordfish.cfd

# this job holds the box SSH key - keep its GITHUB_TOKEN read-only (Bucket 1.5)
permissions:
  contents: read

jobs:
  apply:
    name: converge shell QoL via SSH
    runs-on: ubuntu-latest
    env:
      HOST: ${{ inputs.host || 'syd4.swordfish.cfd' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install CI deploy key
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          [ -n "$SSH_DEPLOY_KEY" ] || { echo "SSH_DEPLOY_KEY secret is not set"; exit 1; }
          mkdir -p ~/.ssh
          # strip CRs defensively (see hardening-smoke.yml, 2026-07-07)
          printf '%s\n' "$SSH_DEPLOY_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "secret does not parse as a private key"; exit 1; }

      - name: Converge shell QoL (idempotent)
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
              "deploy@$HOST" 'bash -s' < provisioning/host/setup-qol.sh

      - name: Idempotency proof - second run must be a no-op
        run: |
          out=$(ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
                    "deploy@$HOST" 'bash -s' < provisioning/host/setup-qol.sh)
          echo "$out"
          echo "$out" | grep -q '== converged: no changes' \
            || { echo "FAIL: second run still reported changes - script is not idempotent"; exit 1; }
