name: cockpit-restore-drill

# Monthly-pass twin of backup-restore-drill for cockpit-class boxes (syd3
# cockpit / syd4 workspace): restore the latest snapshot from B2 onto a fresh
# runner WITHOUT touching the box, proving the CI secrets + encrypted repo
# alone recover the state after total box loss. Per-box secrets selected by
# secret_prefix (keep in lockstep with repository). Content verification is
# per-box: syd4 asserts the 2026-07-10 seed state (~/.claude, vault, repos +
# secrets); syd3 stays at the fresh-box baseline (ssh authorized_keys + shell
# profile) until its swordfish-slice restore lands - grow its checks then.
# Requires repo secrets <PREFIX>_RESTIC_PASSWORD, <PREFIX>_RESTIC_B2_KEY_ID,
# <PREFIX>_RESTIC_B2_KEY. No SSH key needed - never contacts the box.

on:
  workflow_dispatch:
    inputs:
      repository:
        description: restic repository
        required: false
        default: "b2:swordfish-syd3-backups:restic"
      secret_prefix:
        description: Per-box secret prefix (SYD3, SYD4, ...) - keep in lockstep with repository
        required: false
        default: SYD3

permissions:
  contents: read

jobs:
  drill:
    name: restore latest cockpit snapshot on the runner
    runs-on: ubuntu-latest
    env:
      RESTIC_REPOSITORY: ${{ inputs.repository || 'b2:swordfish-syd3-backups:restic' }}
      PREFIX: ${{ inputs.secret_prefix || 'SYD3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select per-box credentials
        # static per-box secret references on purpose: a dynamic
        # secrets[format(...)] index makes Actions provision the ENTIRE secrets
        # context to the runner (zizmor: excessively provisioned secrets).
        # Adding a box = add its three lines here + its prefix to the case
        # guard. Values written to GITHUB_ENV stay log-masked (they match
        # registered secrets); the runner is ephemeral.
        env:
          SYD3_RESTIC_PASSWORD: ${{ secrets.SYD3_RESTIC_PASSWORD }}
          SYD3_RESTIC_B2_KEY_ID: ${{ secrets.SYD3_RESTIC_B2_KEY_ID }}
          SYD3_RESTIC_B2_KEY: ${{ secrets.SYD3_RESTIC_B2_KEY }}
          SYD4_RESTIC_PASSWORD: ${{ secrets.SYD4_RESTIC_PASSWORD }}
          SYD4_RESTIC_B2_KEY_ID: ${{ secrets.SYD4_RESTIC_B2_KEY_ID }}
          SYD4_RESTIC_B2_KEY: ${{ secrets.SYD4_RESTIC_B2_KEY }}
        run: |
          case "$PREFIX" in SYD3|SYD4) ;; *) echo "unknown secret_prefix '$PREFIX' - add its secrets to this step's env first"; exit 1;; esac
          pick() { local v="${PREFIX}_$1"; printf '%s' "${!v}"; }
          RP="$(pick RESTIC_PASSWORD)"; KI="$(pick RESTIC_B2_KEY_ID)"; KK="$(pick RESTIC_B2_KEY)"
          { [ -n "$RP" ] && [ -n "$KI" ] && [ -n "$KK" ]; } || { echo "${PREFIX}_RESTIC_* secrets are not set"; exit 1; }
          {
            echo "RESTIC_PASSWORD=$RP"
            echo "B2_ACCOUNT_ID=$KI"
            echo "B2_ACCOUNT_KEY=$KK"
          } >> "$GITHUB_ENV"

      - name: Install restic at the box pin (read from phase7-backups.sh - one source of truth)
        run: |
          ver=$(grep -m1 '^RESTIC_VERSION=' provisioning/host/phase7-backups.sh | cut -d= -f2)
          sum=$(grep -m1 '^RESTIC_SHA256=' provisioning/host/phase7-backups.sh | cut -d= -f2)
          curl -fsSL -o restic.bz2 "https://github.com/restic/restic/releases/download/v${ver}/restic_${ver}_linux_amd64.bz2"
          echo "$sum  restic.bz2" | sha256sum -c -
          bunzip2 restic.bz2
          chmod +x restic && sudo mv restic /usr/local/bin/restic
          restic version

      - name: Repository integrity check (metadata)
        run: restic check

      - name: Timed restore (RTO) + snapshot age (RPO)
        run: |
          t0=$(date +%s)
          restic restore latest --target ./drill-restore
          rto=$(( $(date +%s) - t0 ))
          snap_json=$(restic snapshots latest --json)
          snap_id=$(echo "$snap_json"   | jq -r '.[0].short_id')
          snap_time=$(echo "$snap_json" | jq -r '.[0].time')
          rpo_h=$(( ( $(date +%s) - $(date -d "$snap_time" +%s) ) / 3600 ))
          files=$(find drill-restore -type f | wc -l)
          size=$(du -sh drill-restore | cut -f1)
          {
            echo "## Cockpit restore drill"
            echo "- snapshot: \`$snap_id\` taken $snap_time"
            echo "- RTO (B2 -> runner, full latest snapshot): ${rto}s"
            echo "- RPO (snapshot age at drill): ${rpo_h}h (nightly cadence: worst case ~24h)"
            echo "- restored: $files files, $size"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify restored content (files, not exit codes)
        run: |
          f() { [ -e "drill-restore$1" ] || { echo "FAIL: missing $1"; exit 1; }; }
          f /home/deploy/.ssh/authorized_keys
          f /home/deploy/.bashrc
          # the restored key material must be the fleet pair, not something else
          grep -q 'swordfish-ops' drill-restore/home/deploy/.ssh/authorized_keys
          grep -q 'swordfish-ci'  drill-restore/home/deploy/.ssh/authorized_keys
          case "$PREFIX" in
            SYD4)
              # the workspace carries the portfolio since the 2026-07-10 seed
              # restore - losing these = losing the agent's memory + the vault
              f /home/deploy/.claude/projects
              f /home/deploy/.claude/CLAUDE.md
              f /home/deploy/vault/AGENTS.md
              f /home/deploy/work/swordfish/AGENTS.md
              f /home/deploy/work/swordfish/.env
              f /home/deploy/work/swordfish/inventory/secrets
              echo "PASS: restored content verified (workspace: baseline + seed state)"
              ;;
            *)
              # syd3 stays at the fresh-box baseline until its swordfish-slice
              # seed restore lands - add its ~/.claude markers then
              echo "PASS: restored content verified (fresh-box baseline)"
              ;;
          esac

      - name: Cleanup restored data
        if: always()
        run: rm -rf drill-restore
