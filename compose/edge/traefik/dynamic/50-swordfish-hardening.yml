# Traefik dynamic config - Bucket 2 hardening (tracked; synced by phase3-edge.sh
# into /etc/dokploy/traefik/dynamic/ alongside the files Dokploy manages there).
# Hot-reloaded by the file provider - no restart needed.
#
# - swordfish-security-headers is attached at the websecure ENTRYPOINT (see
#   traefik.yml), so every TLS router gets it without Dokploy knowing about it.
#   Kept conservative on purpose: HSTS + nosniff + SAMEORIGIN break nothing;
#   CSP/frameDeny would break app embeds and belong per-app, not global.
# - tls.options.default applies to every TLS connection: TLS 1.2 floor with the
#   Mozilla-intermediate 1.2 suites (1.3 suites are always on and not
#   configurable), sniStrict rejects SNI-less probes (e.g. by bare IP) instead
#   of presenting the default certificate.

http:
  middlewares:
    # Attached per-router via each Dokploy domain's middlewares list (Bucket 4)
    # - PUBLIC app routers only, NEVER the deploy. control-plane router: an
    # attacker tripping a rate limit must not be able to lock the founder out
    # of the recovery path (Checkpoint-2 amendment 4 reasoning).
    swordfish-ratelimit:
      rateLimit:
        average: 25
        burst: 50
    # Attached at the websecure ENTRYPOINT (traefik.yml), so EVERY router incl.
    # deploy. gets it - unlike the rate limit, inFlightReq is safe on the control
    # plane: it degrades to a 503 only ABOVE the per-source-IP concurrency cap
    # (no 429 storm that could lock the founder out of the recovery path). Caps
    # the connections a single-IP slowloris/flood can hold open at once; a
    # distributed botnet still needs the Cloudflare edge (security review
    # 2026-07-14, DDoS lens).
    #
    # sourceCriterion is NOT optional here: unlike rateLimit (defaults to the
    # client IP), inFlightReq with no sourceCriterion groups by REQUEST HOST -
    # i.e. 100 concurrent for the whole hostname, which an attacker can hold
    # open to 503 everyone else (found + fixed 2026-07-14; the first cut of
    # this middleware shipped without it). ipStrategy depth 0 = the TCP remote
    # address; when Cloudflare fronts the edge (Next-5) this keeps working
    # only alongside forwardedHeaders.trustedIPs - revisit in that bucket.
    swordfish-inflight:
      inFlightReq:
        amount: 100
        sourceCriterion:
          ipStrategy:
            depth: 0
    swordfish-security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        customFrameOptionsValue: SAMEORIGIN

tls:
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: true
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
