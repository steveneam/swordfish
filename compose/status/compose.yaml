# compose/status - Bucket 4 (Stage 1d): Uptime Kuma at status.swordfish.cfd.
# Apply channel: the Dokploy MCP (NOT edge-apply) - this file is the tracked
# source of truth; changes here are pushed into the Dokploy compose service
# via compose-update + compose-deploy. Dokploy service: composeId
# 5h4OEMKIBVnmSqzMy_TtH, appName swordfish-status-3cv6il (suffix is
# Dokploy-generated), project swordfish. Kuma was pinned at Checkpoint 1; its
# push monitor is the on-infra half of the backup dead-man switch (Bucket 3);
# Gatus stays the documented config-as-code swap path.
#
# - rootless image variant: the container runs unprivileged out of the box
#   (image bar), listens 3001.
# - no ports: published - Traefik reaches Kuma over dokploy-network; the
#   assert-hardening published-ports check stays clean.
# - kuma-data holds a live SQLite db - file-copy backups of it are not
#   consistent; the pre-backup dump hook covers it (provisioning/backup/).

services:
  kuma:
    image: louislam/uptime-kuma:2.4.0-rootless@sha256:a23b9d0029e6f1bc4a0fea0f3ee306d51f43216cd9f8115f8d84d146e9411e4c
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - kuma-data:/app/data
    networks:
      - dokploy-network

volumes:
  kuma-data:

networks:
  # Dokploy's attachable overlay: how Traefik reaches the service (runbooks/edge.md)
  dokploy-network:
    external: true
